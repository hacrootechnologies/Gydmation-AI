# Gydmation AI
#
# You do not normally run this file directly -- the `g` command does it
# for you. It is here so you can see exactly what runs on your machine,
# and change the port if 8080 is already taken.

services:
  gydmation:
    # Pulled from Docker Hub -- no local build needed on a customer's
    # machine. ":latest" is deliberately the default: it means a brand
    # new customer's very first `docker compose pull` just works with
    # zero decisions to make. Pin to an exact version instead by setting
    # GYDMATION_IMAGE, e.g. GYDMATION_IMAGE=hacrootechnologies/gydmation-ai:1.0.0
    image: ${GYDMATION_IMAGE:-hacrootechnologies/gydmation-ai:latest}
    container_name: gydmation-ai
    restart: unless-stopped

    ports:
      # Change the LEFT number only if 8080 is in use on your machine.
      - "${GYDMATION_PORT:-8080}:8080"

    # env_file is deliberately NOT used. Compose treats a missing
    # env_file as a hard error, so a customer who never created a .env
    # (the normal case -- no keys are required) could not start at all.
    # Optional settings are passed individually below instead, each
    # with a safe default.

    environment:
      # Points every data path at the volume below. Without it the app
      # writes INSIDE the container and everything is lost on update.
      GYDMATION_DATA_DIR: /data
      # All optional -- blank is a valid, working configuration.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GYDMATION_LICENSE_KEY: ${GYDMATION_LICENSE_KEY:-}
      GYDMATION_BILLING_MARGIN: ${GYDMATION_BILLING_MARGIN:-1.15}

    volumes:
      # A NAMED volume rather than a host folder. Your conversations,
      # settings and saved keys live here and survive updates. Named
      # volumes also avoid the file-ownership problems a bind mount hits
      # on Windows and macOS, where the container user cannot write to a
      # host-created folder.
      - gydmation-data:/data

    healthcheck:
      # The `g` command waits for this before opening your browser, so
      # you never land on a connection error while it is still starting.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      # The FIRST start builds a vector index from ~2,000 templates,
      # which takes minutes, not 90 seconds. Too short a window marks a
      # perfectly healthy container unhealthy and restarts it mid-build
      # -- forever.
      start_period: 300s

    # A container should not be able to consume the whole machine.
    deploy:
      resources:
        limits:
          # Raised from 2G. The embedding model plus torch plus the
          # vector store sit around 1.5-2GB at rest, so a 2G ceiling
          # leaves no headroom and the kernel OOM-kills the container
          # mid-generation -- which looks like a random crash.
          memory: 4G

volumes:
  gydmation-data:
    name: gydmation-data
